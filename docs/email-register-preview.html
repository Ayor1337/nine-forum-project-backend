<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>验证邮箱 · Nine Forum</title>
</head>
<body style="margin: 0; padding: 0; background-color: #010102; color: #f7f8f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #010102; padding: 48px 20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 500px; background-color: #0f1011; border: 1px solid #23252a; border-radius: 12px;">
                <tr>
                    <td style="padding: 32px 32px 0;">
                        <div style="font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: 0.4px; color: #8a8f98;">NINE FORUM</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 24px 32px 0;">
                        <div style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.4px; color: #f7f8f8;">验证你的邮箱</div>
                        <div style="margin-top: 12px; font-size: 16px; line-height: 24px; color: #8a8f98;">
                            你正在注册 Nine 论坛账号。点击下方按钮完成验证，之后即可回到注册页创建账号。
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 28px 32px 0;">
                        <table role="presentation" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="background-color: #5e6ad2; border-radius: 8px;">
                                    <a href="http://localhost:9966/api/auth/register-verifications?email=user@example.com&amp;token=example-token"
                                       style="display: inline-block; padding: 12px 20px; font-size: 14px; line-height: 17px; font-weight: 500; color: #ffffff; text-decoration: none;">
                                        验证邮箱
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 28px 32px 0;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #141516; border: 1px solid #23252a; border-radius: 8px;">
                            <tr>
                                <td style="padding: 14px 16px;">
                                    <div style="font-size: 12px; font-weight: 500; line-height: 17px; color: #8a8f98;">按钮无法点击？复制此链接</div>
                                    <div style="margin-top: 8px; font-size: 13px; line-height: 20px; word-break: break-all; font-family: ui-monospace, Consolas, 'Courier New', monospace;">
                                        <a href="http://localhost:9966/api/auth/register-verifications?email=user@example.com&amp;token=example-token"
                                           style="color: #5e6ad2; text-decoration: none;">
                                            http://localhost:9966/api/auth/register-verifications?email=user@example.com&amp;token=example-token
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 24px 32px 28px; font-size: 14px; line-height: 21px; color: #62666d;">
                        链接有时效，请尽快验证。如非本人操作，忽略本邮件即可。
                    </td>
                </tr>
                <tr>
                    <td style="padding: 16px 32px 24px; border-top: 1px solid #23252a; font-size: 12px; line-height: 17px; color: #62666d; text-align: center;">
                        系统自动发送，请勿回复
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
