spring:
  application:
    name: nine-forum-project
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://127.0.0.1:16033/nine_forum
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 0
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 5s
      timeout: 5s
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expire: 7
    webauthn:
      rp-id: localhost
      rp-name: NineForum
      allowed-origins:
        - http://localhost:3000
        - http://localhost:10071
        - http://localhost:9966
      challenge-expire-seconds: 300
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: nineforum
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /nine_forum
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      validate-server-certificate: ${RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    listener:
      simple:
        acknowledge-mode: manual
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    protocol: smtp
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            checkserveridentity: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  elasticsearch:
    uris: http://127.0.0.1:9200
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

server:
  port: 9966

nine-forum:
  public-base-url: http://localhost:9966
  registration-verification:
    idempotency-seconds: 60
    email-limit: 3
    email-window-seconds: 900
    ip-limit: 10
    ip-window-seconds: 900
    global-limit: 100
    global-window-seconds: 600
    global-alert-percent: 80
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:10071

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  enable: true
